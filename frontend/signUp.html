    <form class="container">
        <img src="img/logo.png" alt="Logo del sitio">
        <h1>Introduce tus datos para registrarte</h1>


        <div class="form__group field">
            <input type="text" class="form__field" placeholder="Nombre completo" id="full-name" required>
            <label for="full-name" class="form__label">Nombre completo</label>
        </div>

        <div class="form__group field">
            <input type="text" class="form__field" placeholder="Apellido" id="last-name" required>
            <label for="last-name" class="form__label">Apellido</label>
        </div>

        <div class="form__group field">
            <input type="email" class="form__field" placeholder="Correo electrónico" id="email" required>
            <label for="email" class="form__label">Correo electrónico</label>
        </div>

        <div class="form__group field">
            <input type="password" class="form__field" id="password" placeholder="Contraseña" required>
            <label for="password" class="form__label">Contraseña</label>
            <div class="strength-bar">
                <div id="strength-fill" class="strength-fill"></div>
            </div>
            <div id="strength-text"></div>
        </div>

        <div class="form__group field">
            <input type="password" id="confirm-password" class="form__field" placeholder="Confirmar Contraseña" required>
            <label for="confirm-password" class="form__label">Confirmar Contraseña</label>
            <div id="match-message" style="margin-top: 5px; font-weight: bold;"></div>
            <img id="image-preview" src="" alt="Vista previa" style="max-width: 150px; margin-top: 10px; display: none; border-radius: 8px;">

        </div>


        <div class="form__group field">
            <input type="file" id="file-upload" class="form__field img_field" placeholder="Imagen de perfil">
            <label for="file-upload" class="form__label">Imagen de perfil</label>
            <label for="file-upload" class="upload_label">Seleccionar archivo</label>
            <span id="file-name" style="font-size: 0.9em; color: #666;"></span>
        </div>

        <button id="submit-btn" disabled class="disabled">CREAR CUENTA</button>

        <p class="msjreg">¿Ya tenés cuenta? <a class="msjreg" href="login.html">Inicia sesión</a></p>
    </form>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const footerLogo = document.querySelector('.footerLogo img');

        if (footerLogo) {
        // Ocultamos el logo inicialmente
        footerLogo.style.opacity = '0';
        footerLogo.style.transform = 'scale(0.3)';

        const logoObserver = new IntersectionObserver(entries => {
            entries.forEach(entry => {
            if (entry.isIntersecting) {
                footerLogo.classList.add('bounce-in');
                logoObserver.unobserve(footerLogo);
            }
            });
        }, {
            threshold: 0.3
        });

        logoObserver.observe(footerLogo);
        }
    });
    </script>

    <script>
        const passwordInput = document.getElementById('password');
        const strengthFill = document.getElementById('strength-fill');
        const strengthText = document.getElementById('strength-text');
        const confirmInput = document.getElementById('confirm-password');
        const matchMessage = document.getElementById('match-message');
        const submitBtn = document.getElementById('submit-btn');

        const requiredFields = ['full-name', 'last-name', 'email', 'password', 'confirm-password'];

        // Evaluar fuerza
        passwordInput.addEventListener('input', () => {
            const value = passwordInput.value;
            let strength = 0;

            if (value.length >= 6) strength++;
            if (/[A-Z]/.test(value)) strength++;
            if (/[0-9]/.test(value)) strength++;
            if (/[^A-Za-z0-9]/.test(value)) strength++;

            strengthFill.className = 'strength-fill';

            switch (strength) {
                case 0:
                    strengthFill.style.width = '0%';
                    strengthText.textContent = '';
                    break;
                case 1:
                    strengthFill.style.width = '25%';
                    strengthFill.classList.add('weak');
                    strengthText.textContent = 'Débil';
                    strengthText.style.color = 'red';
                    break;
                case 2:
                    strengthFill.style.width = '50%';
                    strengthFill.classList.add('medium');
                    strengthText.textContent = 'Media';
                    strengthText.style.color = 'orange';
                    break;
                case 3:
                    strengthFill.style.width = '75%';
                    strengthFill.classList.add('strong');
                    strengthText.textContent = 'Fuerte';
                    strengthText.style.color = 'green';
                    break;
                case 4:
                    strengthFill.style.width = '100%';
                    strengthFill.classList.add('very-strong');
                    strengthText.textContent = 'Muy fuerte';
                    strengthText.style.color = 'darkgreen';
                    break;
            }

            checkPasswordMatch(); // también actualizamos coincidencia
            validateForm();       // y si se puede habilitar el botón
        });

        // Verificar si las contraseñas coinciden
        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            if (confirm === '') {
                matchMessage.textContent = '';
            } else if (password === confirm) {
                matchMessage.textContent = 'Las contraseñas coinciden';
                matchMessage.style.color = 'green';
            } else {
                matchMessage.textContent = 'Las contraseñas no coinciden';
                matchMessage.style.color = 'red';
            }
        }

        // Habilitar o deshabilitar botón
        function validateForm() {
            let allFilled = true;

            for (let id of requiredFields) {
                const input = document.getElementById(id);
                if (!input || input.value.trim() === '') {
                    allFilled = false;
                    break;
                }
            }

            const passwordsMatch = passwordInput.value === confirmInput.value;

            if (allFilled && passwordsMatch) {
                submitBtn.disabled = false;
                submitBtn.className = 'allow';
            } else {
                submitBtn.disabled = true;
                submitBtn.className = 'disabled';
            }
        }

        // Activar validación en todos los campos
        requiredFields.forEach(id => {
            const input = document.getElementById(id);
            if (input) {
                input.addEventListener('input', () => {
                    checkPasswordMatch();
                    validateForm();
                });
            }
        });

        const fileUpload = document.getElementById('file-upload');
        const fileNameDisplay = document.getElementById('file-name');

        fileUpload.addEventListener('change', () => {
        if (fileUpload.files.length > 0) {
            fileNameDisplay.textContent = `Archivo seleccionado: ${fileUpload.files[0].name}`;
        } else {
            fileNameDisplay.textContent = '';
        }
        });

        const imagePreview = document.getElementById('image-preview');

        fileUpload.addEventListener('change', () => {
        if (fileUpload.files.length > 0) {
            const file = fileUpload.files[0];
            fileNameDisplay.textContent = `Archivo seleccionado: ${file.name}`;

            // Mostrar vista previa si es imagen
            const reader = new FileReader();
            reader.onload = function (e) {
            imagePreview.src = e.target.result;
            imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            fileNameDisplay.textContent = '';
            imagePreview.style.display = 'none';
        }
        });

    
    </script>

</body>
