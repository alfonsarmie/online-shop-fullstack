<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagar</title>
    <link rel="stylesheet" href="stylesPay.css">
    <link rel="stylesheet" href="nav-and-footer.css">
    <link rel="icon" href="img/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Anton&family=Kaushan+Script&family=Knewave&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/d58967e1d7.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>      
        <nav>       
            <div class="nav-toggle" id="navToggle">
                <i class="fa-solid fa-bars"></i>
            </div>

            <div class="nav-left">
                <a href="index.html">
                <img src="img/logo.png">
                </a>
            </div>

            <div class="nav-links" id="navLinks">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="#productos">Productos</a></li>
                </ul>
                
            </div>

            <div class="btnsRight">  
                <a href="login.html" class="btnLogIn"><i class="fa-solid fa-user"></i></a>
                <a href="javascript:void(0);" id="openCart" class="cart-icon"><i class="fa-solid fa-cart-shopping"></i></a>
            </div>
        </nav>
    </header>

    <main>
        <div class="data-container">
            <div class="progress-container">
                <div class="step active">Your details</div>
                <div class="progress-line"></div>
                <div class="step">Payment</div>
            </div>

            <div class="form-container">
                <form action="">
                    <h3>Tus detalles</h3>
                    <div class="form__group field">
                        <input type="text" class="form__field nameInput" placeholder="Nombre completo" required="">
                        <label for="name" class="form__label">Nombre completo</label>
                    </div>

                    <div class="email-phone-container">
                        <div class="form__group field">
                            <input type="email" class="form__field emailInput" placeholder="Correo electrónico" required="">
                            <label for="email" class="form__label">Correo electrónico</label>
                        </div>
                        <div class="form__group field">
                            <input type="text" class="form__field phoneInput" placeholder="Teléfono" required="">
                            <label for="phone" class="form__label">Teléfono</label>
                        </div>
                    </div>

                    <button type="submit">CONTINUAR</button>
                </form>
            </div>
        </div>

        <div class="cart-container">
            <div class="cart-header">
                <h2>Tu carrito | <span id="itemCount">0</span> Artículos</h2>
            </div>
            <div id="cartItems" class="cart-items"></div>
            <div class="cart-footer">
                <p class="cart-footer-item">Subtotal: $<span id="subtotal">0</span></p>
                <p class="cart-footer-item">Total: $<span id="total">0</span></p>
            </div>
        </div>

    </main>

    <footer>
        <div class="footerContainer">
          <div class="footerLogo">
            <img src="img/logo.png" alt="Logo del sitio">
          </div>
    
          <ul class="footerLinks">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="index.html#productos">Productos</a></li>
          </ul>
    
          <div class="footerSocial">
            <a href="https://www.facebook.com/rosariorowingcluboficial?locale=es_LA"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/rosariorowingclub/"><i class="fab fa-instagram"></i></a>
            <a href="https://x.com/rowing_rrc"><i class="fab fa-twitter"></i></a>
          </div>
    
          <p>&copy; 2025 Mi Sitio Web. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
        const footerLogo = document.querySelector('.footerLogo img');

        if (footerLogo) {
        // Ocultamos el logo inicialmente
        footerLogo.style.opacity = '0';
        footerLogo.style.transform = 'scale(0.3)';

        const logoObserver = new IntersectionObserver(entries => {
            entries.forEach(entry => {
            if (entry.isIntersecting) {
                footerLogo.classList.add('bounce-in');
                logoObserver.unobserve(footerLogo);
            }
            });
        }, {
            threshold: 0.3
        });

        logoObserver.observe(footerLogo);
        }
        });
    </script>

</body>
</html>
